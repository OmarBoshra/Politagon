name: politagon
description: "political strategy game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  bloc: ^8.1.0
  flutter_bloc: ^8.1.1
  audioplayers: ^6.5.0
  logger: ^2.0.2
  flutter_svg: ^2.2.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  # High-performance video engine
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  media_kit_libs_android_video: ^1.0.0

dependency_overrides:
  media_kit_video: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon_windows.png"
  windows:
    generate: true
    image_path: "assets/icon_windows.png"
    icon_size: 256

msix_config:
  display_name: Politagon
  publisher_display_name: Politagon Studio
  publisher: CN=Politagon
  identity_name: com.politagon.game
  msix_version: 1.0.0.0
  logo_path: assets/icon_windows.png
  capabilities: internetClient, location, microphone, webcam
  generate_signing_certificate: true
  install_certificate: true
  # REQUIRED for media_kit in MSIX:
  # This ensures the native DLLs for video decoding are included in the package
  architecture: x64

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/victory.mp3
    - assets/sounds/background.m4a
    - assets/logo.jpg
    - assets/videos/politagon_thriller.mp4
    - assets/videos/game_start.mp4
